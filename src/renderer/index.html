<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Same policy as before: no remote anything, scripts from the bundle only. `unsafe-inline` for
      styles is what lets the renderer set a custom property on an element; the stylesheet itself
      is a bundled file, which is 'self'.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:"
    />
    <title>Textlens</title>
    <style>
      /*
        Pre-boot only. Everything this window actually looks like is in `settings/settings.css`,
        which the bundle imports; these few rules exist so the fallback markup below is legible if
        the script never runs, and so the window does not flash white before the stylesheet lands.
      */
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        background: #101014;
        color: #e8e8ef;
        font-family: 'Segoe UI', system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <main id="root">
      <h1>Textlens</h1>
      <p>renderer did not boot</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
