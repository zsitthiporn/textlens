<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <!--
      `font-src 'self'` is new in M5-02 and is load-bearing: the default-src is 'none', so
      without it the bundled @font-face is blocked, the overlay silently falls back to a system
      Thai face, and every height M5-03 measures is measured against the wrong metrics.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'"
    />
    <title>Textlens overlay</title>
    <link rel="stylesheet" href="./overlay.css" />
  </head>
  <body>
    <!--
      The only element in the document. Every translation box is created once, at startup, by
      the node pool (M5-01) and lives in here for the process's lifetime; nothing else is ever
      added or removed. Counting this element's children is how the "no DOM nodes created after
      init" criterion is checked against the real renderer.

      The M1-05 probe UI that used to be here - screen-edge markers, corner labels, a click
      counter - is gone. It was explicitly a test target for "does the window cover the display
      and pass clicks through", and leaving it in would paint a magenta frame around the user's
      screen for as long as the app runs.
    -->
    <div id="boxes"></div>

    <!--
      The status banner (#41). Empty and `hidden` until the main process says otherwise, so a
      healthy session paints nothing here at all.

      Pinned to the **top** of the screen by the stylesheet, which is a requirement and not a
      preference: the primary use case is subtitles, subtitles live along the bottom edge, and
      #41 asks that the error text never cover the area being read. `aria-live` because this is
      the one thing in this window that changes without the user doing anything.
    -->
    <div id="status" role="status" aria-live="polite" hidden>
      <span id="status-cause"></span>
      <span id="status-remedy"></span>
    </div>

    <script type="module" src="./overlay.ts"></script>
  </body>
</html>
